[tool.uv.workspace]
members = ["algorithms/*"]
exclude = [
    "algorithms/random", 
    "algorithms/traceback",
    "algorithms/diagfusion", 
    "algorithms/eadro",
    "algorithms/art",
]
[project]
name = "rca-algo-contrib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rcabench-platform>=0.4.1",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "toml>=0.10.2",
]

[tool.uv]
package = false

[tool.pyright]
exclude = [ #
    ".git",
    "**/__pycache__",
    ".venv",
    ".vscode",
    ".idea",
    "data/",
    "output/",
    "temp/",
]

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]