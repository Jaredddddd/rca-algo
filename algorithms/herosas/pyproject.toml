[project]
name = "herosas"
version = "0.1.0"
description = "HeroSAS metric anomaly RCA adapted for RCABench"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "rcabench-platform>=0.4.1",
]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
