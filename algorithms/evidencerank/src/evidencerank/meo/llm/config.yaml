synthesis:
  # Default is mock so no external LLM call is made accidentally.
  mode: mock
  allow_real_llm: false
  output_path: null
  library_name: crest-meol-default-v1
  dsl_version: "1.0"
  validate_static: true
  validate_leakage: true
  fail_on_verifier_error: true

llm:
  provider: mock
  model: ""
  api_key_env: OPENAI_API_KEY
  base_url: null
  temperature: 0.0
  max_output_tokens: 8192
  timeout_seconds: 60
  response_format: json_object

prompt:
  version: meo_operator_synthesis_v1
  artifact_summary_path: null
  telemetry_schema_path: null
  mechanism_catalog_path: null
  include_default_mechanism_catalog: true
  extra_context: {}

mock:
  variant: default_meol_v1
