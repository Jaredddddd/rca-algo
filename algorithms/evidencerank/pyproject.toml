[project]
name = "evidencerank"
version = "0.1.0"
description = "Multi-modal evidence ranking RCA algorithm"
requires-python = ">=3.13"
dependencies = [
    "crest",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "rcabench-platform>=0.3.30",
]

[tool.uv.sources]
crest = { workspace = true }

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
