name: Auto Update Submodules (Script)

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/auto-update-submodules-script.yml'

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Configure Git to use HTTPS with PAT for private repositories
        if [ -n "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
          git config --global url."https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "Git configured to use HTTPS with custom PAT"
        else
          echo "Warning: No PERSONAL_ACCESS_TOKEN available"
          exit 1
        fi
    
    - name: Make script executable
      run: |
        chmod +x scripts/update_submodules.sh
    
    - name: Run submodule update script
      run: |
        echo "=== Running Submodule Update Script ==="
        
        # Run the script in non-interactive mode
        if [ -f scripts/update_submodules.sh ]; then
          # Set environment variable to indicate non-interactive mode
          export NON_INTERACTIVE=true
          
          # Run the script
          ./scripts/update_submodules.sh
          SCRIPT_EXIT_CODE=$?
          
          # Check script exit code
          if [ $SCRIPT_EXIT_CODE -eq 0 ]; then
            echo "✅ Script completed successfully with updates"
          elif [ $SCRIPT_EXIT_CODE -eq 2 ]; then
            echo "ℹ️ Script completed successfully - no updates needed (exit code 2)"
          else
            echo "❌ Script failed with exit code $SCRIPT_EXIT_CODE"
            exit 1
          fi
        else
          echo "❌ Script not found: scripts/update_submodules.sh"
          exit 1
        fi
    
    - name: Push changes
      run: |
        echo "=== Pushing Changes ==="
        
        # Check if there are changes to push
        if ! git diff-index --quiet HEAD --; then
          echo "Changes detected, pushing to repository..."
          
          # Get current branch
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" = "HEAD" ]; then
            # We're in detached HEAD, get the branch from github.ref
            CURRENT_BRANCH=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
          fi
          
          echo "Current branch: $CURRENT_BRANCH"
          
          # Push to the current branch
          if git push origin HEAD:$CURRENT_BRANCH; then
            echo "Successfully pushed changes to $CURRENT_BRANCH"
          else
            echo "Failed to push changes"
            exit 1
          fi
        else
          echo "No changes to push"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    
    - name: Report status
      run: |
        echo "=== Final Status Report ==="
        
        # Check if there were any changes
        if git diff-index --quiet HEAD --; then
          echo "ℹ️ No changes detected - submodules were already up to date"
        else
          echo "✅ Changes detected - submodules were updated"
        fi
        
        echo "📅 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "🔄 Trigger: ${{ github.event_name }}"
        echo "📝 Status: Submodule update script completed successfully" 